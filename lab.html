<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management System</title>
    <style>
      :root {
        --primary: #4f46e5;
        --danger: #ef4444;
        --success: #22c55e;
        --dark: #1f2937;
        --light: #f3f4f6;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #fafafa;
        color: var(--dark);
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 20px;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }
      h2 {
        margin-top: 0;
        border-bottom: 2px solid var(--light);
        padding-bottom: 10px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
      }
      .btn-danger {
        background: var(--danger);
      }
      .search-box {
        margin-bottom: 15px;
        display: flex;
        gap: 10px;
      }
      .search-box input {
        flex: 1;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .search-box select {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid var(--light);
      }
      th {
        background: var(--light);
        font-weight: 600;
      }
      .avatar {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        object-fit: cover;
      }
      .actions button {
        padding: 5px 10px;
        margin-right: 5px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        color: white;
      }
      .actions .btn-edit {
        background: var(--primary);
      }
      .actions .btn-delete {
        background: var(--danger);
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h2 id="form-title">Add New User</h2>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullname" placeholder="John Doe" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="john@example.com" />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" id="phone" placeholder="012345678" />
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select id="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Role</label>
          <input type="text" id="role" placeholder="Admin, Staff, etc." />
        </div>
        <div class="form-group">
          <label>Photo URL</label>
          <input
            type="text"
            id="photo"
            placeholder="https://example.com/avatar.jpg"
          />
        </div>
        <button onclick="HandleSubmit()" id="add" class="btn">Add User</button>
      </div>

      <div class="card">
        <h2>User Management Registry</h2>

        <div class="search-box">
          <input
            type="text"
            id="search-input"
            placeholder="Type to search..."
            oninput="GetUsers()"
          />
          <select id="search-key" onchange="GetUsers()">
            <option value="fullname">Search by Name</option>
            <option value="email">Search by Email</option>
            <option value="role">Search by Role</option>
          </select>
        </div>

        <table>
          <thead>
            <tr>
              <th>Photo</th>
              <th>Full Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Gender</th>
              <th>Role</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="listuser"></tbody>
        </table>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
