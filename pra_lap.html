<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen p-6">
    
    <div class="max-w-7xl mx-auto mb-6">
      <h1 class="text-3xl font-bold text-slate-900">Practice</h1>
    </div>

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
        <h2 class="text-xl font-bold mb-4 pb-2 border-b border-slate-100 text-slate-900">
          Add new user
        </h2>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Full Name</label>
            <input
              type="text"
              id="fullname"
              placeholder="Korn Leanghong"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
            <input
              type="email"
              id="email"
              placeholder="sursdey@gmail.com"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Phone</label>
            <input
              type="tel"
              id="phone"
              placeholder="012 123 345"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Gender</label>
            <select
              id="gender"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            >
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Role</label>
            <input
              type="text"
              id="role"
              placeholder="Admin/User/Student"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Photo</label>
            <input
              type="file"
              id="photo"
              class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 border border-slate-300 rounded-lg cursor-pointer focus:outline-none"
            />
          </div>

          <button
            onclick="HandleSubmit()"
            id="add"
            class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200 shadow-sm"
          >
            Add new User
          </button>
        </div>
      </div>

      <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
        <h2 class="text-xl font-bold mb-4 pb-2 border-b border-slate-100 text-slate-900">
          User List
        </h2>

        <div class="flex flex-col sm:flex-row gap-3 mb-6">
          <input
            type="search"
            id="search"
            placeholder="search what u want"
            class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          />
          <select
            id="search-key"
            class="px-4 py-2 border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          >
            <option value="fullname">Search by Name</option>
            <option value="email">Search by Email</option>
            <option value="role">Search by Role</option>
          </select> 
        </div>

        <div class="over-flow-x-auto">
          <table class="w-full table-auto border-collapse border border-slate-200">
            <thead>
              <tr class="bg-slate-100 text-left">
                <th class="border border-slate-300 px-4 py-2">ID</th>
                <th class="border border-slate-300 px-4 py-2">Full Name</th>
                <th class="border border-slate-300 px-4 py-2">Email</th>
                <th class="border border-slate-300 px-4 py-2">Phone</th>
                <th class="border border-slate-300 px-4 py-2">Actions</th>
              </tr>
            </thead>
            <tbody class="bg-white">
              <!-- User rows will be populated here -->
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    <script src="crude.js"></script>

    
  </body>
</html>
